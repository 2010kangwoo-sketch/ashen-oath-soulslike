<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta
      name="description"
      content="Ashen Oath: 브라우저 기반 3D 소울라이크 이동 검증 빌드"
    />
    <title>Ashen Oath — Pass 1</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Ashen Oath 3D 이동 검증 장면"></canvas>
      <div id="loading-screen" role="status" aria-live="polite">
        <p class="loading-kicker">ASHEN OATH</p>
        <h1>잿빛 성역을 깨우는 중</h1>
        <div class="loading-track"><span id="loading-progress"></span></div>
        <p id="loading-label">렌더러 준비</p>
      </div>
      <section id="hud" class="hud is-hidden" aria-label="개발 빌드 상태">
        <div class="brand-panel">
          <p class="eyebrow">MOVEMENT BUILD · PASS 1</p>
          <h1>Ashen Oath</h1>
          <p>계단·경사·충돌·추적 카메라 검증 성역</p>
        </div>
        <div class="status-panel" aria-live="polite">
          <div><span>렌더링</span><strong id="render-status">대기</strong></div>
          <div><span>물리</span><strong id="physics-status">대기</strong></div>
          <div><span>프레임</span><strong id="fps-status">--</strong></div>
          <div><span>동작</span><strong id="movement-status">공중</strong></div>
          <div><span>속도</span><strong id="speed-status">0.0 m/s</strong></div>
          <div><span>바닥</span><strong id="grounded-status">공중</strong></div>
        </div>
        <div class="route-panel" aria-hidden="true">
          <span>계단 시험</span>
          <span>중앙 성소</span>
          <span>경사 시험</span>
        </div>
        <div class="help-panel">
          <p><kbd>W A S D</kbd> 이동</p>
          <p><kbd>Shift</kbd> 달리기</p>
          <p><kbd>마우스 드래그</kbd> 시점 회전</p>
          <p><kbd>휠</kbd> 카메라 거리</p>
          <p><kbd>R</kbd> 시작 위치로 복귀</p>
          <p><kbd>H</kbd> 조작 안내 숨기기</p>
        </div>
      </section>
      <div id="fatal-error" class="fatal-error is-hidden" role="alert"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
