<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta
      name="description"
      content="Ashen Oath: 브라우저 기반 3D 소울라이크의 기반 검증 빌드"
    />
    <title>Ashen Oath — Foundation</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Ashen Oath 3D 기반 검증 장면"></canvas>
      <div id="loading-screen" role="status" aria-live="polite">
        <p class="loading-kicker">ASHEN OATH</p>
        <h1>기반 시스템을 깨우는 중</h1>
        <div class="loading-track"><span id="loading-progress"></span></div>
        <p id="loading-label">렌더러 준비</p>
      </div>
      <section id="hud" class="hud is-hidden" aria-label="개발 빌드 상태">
        <div class="brand-panel">
          <p class="eyebrow">FOUNDATION BUILD · PASS 0</p>
          <h1>Ashen Oath</h1>
          <p>10차 본작업 전 기술 검증 장면</p>
        </div>
        <div class="status-panel" aria-live="polite">
          <div><span>렌더링</span><strong id="render-status">대기</strong></div>
          <div><span>물리</span><strong id="physics-status">대기</strong></div>
          <div><span>프레임</span><strong id="fps-status">--</strong></div>
        </div>
        <div class="help-panel">
          <p><kbd>마우스 드래그</kbd> 시점 회전</p>
          <p><kbd>휠</kbd> 확대·축소</p>
          <p><kbd>R</kbd> 물리 시험체 재배치</p>
          <p><kbd>H</kbd> 안내 숨기기</p>
        </div>
      </section>
      <div id="fatal-error" class="fatal-error is-hidden" role="alert"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
